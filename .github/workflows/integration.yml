name: Integration Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'examples/**'
      - 'docker-compose.yml'
      - 'tests/integration/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'examples/**'
      - 'docker-compose.yml'
      - 'tests/integration/**'

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22.4'
          cache: false

      - name: Build binaries
        run: |
          mkdir -p bin
          go build -o bin/taskforge-cli ./cmd/cli
          go build -o bin/taskforge-worker ./cmd/worker
          go build -o bin/redis-demo ./examples/redis-demo

      - name: Wait for Redis to be ready
        run: |
          for i in {1..30}; do
            if redis-cli -h 127.0.0.1 -p 6379 ping | grep -q PONG; then
              echo "Redis is ready"
              break
            fi
            echo "Waiting for Redis... ($i/30)"
            sleep 2
          done

      - name: Run Redis demo integration test
        run: |
          chmod +x tests/integration/redis_demo.sh
          tests/integration/redis_demo.sh

      - name: Run smoke test (when CLI is ready)
        run: |
          if [ -f "tests/integration/smoke.sh" ]; then
            chmod +x tests/integration/smoke.sh
            tests/integration/smoke.sh
          else
            echo "Smoke test not yet implemented - will be added in Phase 2B"
          fi
        continue-on-error: true