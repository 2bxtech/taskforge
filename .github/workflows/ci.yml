name: CI

on:
  push:
    branches: [ main, dev, 'feat/*' ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test-and-lint:
    name: Test & Lint
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true

    - name: Install dependencies
      run: |
        go mod download
        go mod tidy

    - name: Run linter
      run: |
        go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
        golangci-lint run --timeout=5m

    - name: Run tests
      run: |
        go test -v -race -coverprofile=coverage.out ./...
        go tool cover -func=coverage.out

    - name: Build binaries
      run: |
        mkdir -p bin
        go build -o bin/taskforge-api ./cmd/api
        go build -o bin/taskforge-worker ./cmd/worker
        go build -o bin/taskforge-scheduler ./cmd/scheduler  
        go build -o bin/taskforge-cli ./cmd/cli

    - name: Build demos
      run: |
        go build -o bin/redis-demo ./examples/redis-demo
        go build -o bin/worker-engine-demo ./examples/worker-engine-demo

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        file: ./coverage.out
        flags: unittests
        name: taskforge-coverage
        fail_ci_if_error: false
      continue-on-error: true
